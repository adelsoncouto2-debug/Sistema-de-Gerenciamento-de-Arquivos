{% extends "base.html" %}
{% block title %}Cadastro de Aluno - Gerenciador de Estagios{% endblock %}

{% block content %}
<div class="card">
    <div class="card-header">
        <h2>Cadastro de aluno e estagio</h2>
    </div>
    <div class="card-body">
        <form method="post" action="{{ url_for('cadastro') }}">
            <h3 class="mb-2 text-sm" style="color: var(--gray-500); text-transform: uppercase; letter-spacing: 0.04em;">Dados do aluno</h3>

            <div class="form-row">
                <div class="form-group">
                    <label for="nome">Nome completo *</label>
                    <input type="text" id="nome" name="nome" required maxlength="200" placeholder="Nome do aluno">
                </div>
                <div class="form-group">
                    <label for="matricula">Matricula *</label>
                    <input type="text" id="matricula" name="matricula" required maxlength="50" placeholder="Numero de matricula">
                </div>
            </div>

            <div class="form-group">
                <label for="curso">Curso *</label>
                <input type="text" id="curso" name="curso" required maxlength="150" placeholder="Ex: Engenharia de Software">
            </div>

            <h3 class="mb-2 mt-2 text-sm" style="color: var(--gray-500); text-transform: uppercase; letter-spacing: 0.04em;">Dados do estagio</h3>

            <div class="form-group">
                <label for="empresa">Empresa *</label>
                <input type="text" id="empresa" name="empresa" required maxlength="200" placeholder="Nome da empresa concedente">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="inicio">Data de inicio *</label>
                    <input type="date" id="inicio" name="inicio" required>
                </div>
                <div class="form-group">
                    <label for="termino">Data de termino</label>
                    <input type="date" id="termino" name="termino">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="obrigatorio">Tipo de estagio *</label>
                    <select id="obrigatorio" name="obrigatorio" required>
                        <option value="1">Obrigatorio</option>
                        <option value="0">Nao obrigatorio</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="tipo">Descricao / modalidade</label>
                    <input type="text" id="tipo" name="tipo" maxlength="100" placeholder="Ex: Estagio curricular">
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Cadastrar</button>
                <a href="{{ url_for('index') }}" class="btn btn-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
